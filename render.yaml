services:
  - type: web
    name: maintainpro-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/server.js
    healthCheckPath: /api/v1/health/live
    envVars:
      - fromGroup: maintainpro-production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: maintainpro-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: maintainpro-production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

envVarGroups:
  - name: maintainpro-production
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: https://maintainpro.samueldev.cv
      - key: FRONTEND_URL
        value: https://maintainpro.samueldev.cv
      - key: QUEUE_DRIVER
        value: bullmq
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_FROM_NAME
        value: MaintainPro
      - key: MAIL_FROM_EMAIL
        value: noreply@maintainpro.samueldev.cv
      - key: GOOGLE_CLIENT_REDIRECT_URI
        value: https://<render-backend-host>.onrender.com/api/v1/auth/google/callback
      - key: BILLING_DEFAULT_PROVIDER
        value: stripe
      - key: REDIS_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: TUNNEL_PROVIDER
        value: none
      - key: TUNNEL_AUTOSTART
        value: "false"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OAUTH_STATE_EXPIRES_IN
        value: 10m
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
