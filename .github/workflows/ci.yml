name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 10
          --replSet rs0 --bind_ip_all
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Initialize MongoDB replica set
        run: |
          for attempt in {1..30}; do
            mongosh mongodb://127.0.0.1:27017/admin --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id:"rs0", members:[{_id:0, host:"127.0.0.1:27017"}]}) }' && break
            sleep 2
          done
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/maintainpro_test
          REDIS_DISABLE_CONNECTION: "false"
          TEST_USE_REDIS: "true"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
      - name: Build production container
        run: docker build -t maintainpro-backend:ci .
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-diagnostics
          if-no-files-found: ignore
          path: |
            npm-debug.log
            **/npm-debug.log
            coverage/
            dist/
